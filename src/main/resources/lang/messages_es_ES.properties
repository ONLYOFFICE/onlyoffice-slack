help.greeting=¡Hola <@{0}>! Soy ONLYOFFICE, y estoy aquí para ayudarle a mejorar la colaboración en equipo en Slack.
help.instructions=📂 A continuación, se explica cómo empezar:\n• Seleccione un mensaje directo o un canal.\n• Envíe un nuevo mensaje con un archivo adjunto o busque un mensaje con un archivo existente.\n• Haga clic en Más acciones -> Conectarse a aplicaciones -> y seleccione ONLYOFFICE.\n• Elija el archivo y haga clic en Abrir junto al archivo seleccionado.\n• Edite el archivo según sea necesario. Los cambios se guardarán automáticamente.\n\n➕ ¿Cómo crear un archivo?\n• Seleccione un mensaje directo o un canal.\n• Introduzca el comando /file.\n• Elija el formato deseado e introduzca un título para el archivo.\n• Abra el archivo haciendo clic en Más acciones -> Conectarse a aplicaciones -> y seleccione ONLYOFFICE.\n• Elija el archivo y haga clic en Abrir junto al archivo seleccionado.\n• Realice las modificaciones en el archivo creado. ¡Los cambios se guardan automáticamente!
