help.greeting=こんにちは<@{0}> ！ONLYOFFICEです。Slackでのチームエンゲージメントとコラボレーションの向上をお手伝いします。
help.instructions=📂 開始方法：\n• ダイレクトメッセージまたはチャンネルを選択します。\n• 添付ファイル付きの新しいメッセージを送信するか、既存のファイルを含むメッセージを探します。\n• その他のアクション -> アプリに接続 -> をクリックし、ONLYOFFICEを選択します。\n• ファイルを選択し、選択したファイルの横にある「開く」をクリックします。\n• 必要に応じてファイルを編集します。変更は自動的に保存されます。\n\n➕ ファイルを作成する方法：\n• ダイレクトメッセージまたはチャンネルを選択します。\n• /fileコマンドを入力します。\n• 希望する形式を選択し、ファイルのタイトルを入力します。\n• その他のアクション -> アプリに接続 -> をクリックし、ONLYOFFICEを選択してファイルを開きます。\n• ファイルを選択し、選択したファイルの横にある「開く」をクリックします。\n• 作成されたファイルで編集を行います。変更は自動的に保存されます！
