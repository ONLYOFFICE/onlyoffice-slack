help.greeting=你好，<@{0}>！我是 ONLYOFFICE，很高兴能帮助您提升团队在 Slack 上的协作效率。
help.instructions=📂 以下是入门指南：\n• 选择一个私信或频道。\n• 发送附带文件的新消息，或找到包含已有文件的消息。\n• 点击“更多操作”->“连接应用”->选择 ONLYOFFICE。\n• 选择文件并点击对应文件旁的“打开”。\n• 按需编辑文件，所有更改将自动保存。\n\n➕ 如何创建文件？\n• 选择一个私信或频道。\n• 输入 /file 命令。\n• 选择所需格式并输入文件标题。\n• 点击“更多操作”->“连接应用”->选择ONLYOFFICE打开文件。\n• 选择文件并点击对应文件旁的“打开”。\n• 在创建的文件中进行编辑，更改将自动保存！
