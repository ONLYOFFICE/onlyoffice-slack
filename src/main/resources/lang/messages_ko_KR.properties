help.greeting=<@{0}>님, 안녕하세요! ONLYOFFICE가 Slack에서 팀 참여도와 협업을 높일 수 있도록 도움을 드리고자 합니다.
help.instructions=📂 이렇게 시작하세요:\n• 다이렉트 메시지 또는 채널을 선택하세요.\n• 첨부 파일과 함께 새 메시지를 보내거나 기존 파일이 첨부된 메시지를 찾으세요.\n• 추가 작업 -> 앱 연결 -> ONLYOFFICE를 선택하세요.\n• 파일을 선택한 뒤 선택한 파일 옆의 열기를 클릭하세요.\n• 필요에 따라 파일을 편집하세요. 변경 사항은 자동으로 저장됩니다.\n\n➕ 파일 생성 방법:\n• 다이렉트 메시지 또는 채널을 선택하세요.\n• /file command를 입력하세요.\n• 원하는 파일 형식을 선택하고 파일 제목을 입력하세요.\n• 추가 작업 -> 앱 연결 -> ONLYOFFICE를 선택하여 파일을 여세요.\n• 파일을 선택한 뒤 선택한 파일 옆의 열기를 클릭하세요.\n• 생성된 파일을 편집하세요. 변경 사항은 자동으로 저장됩니다! 
help.learnMore=ONLYOFFICE에 대해 더 자세히 알아보기
