help.greeting=Bonjour <@{0}> ! Je suis ONLYOFFICE, ici pour vous aider à améliorer l'engagement et la collaboration de votre équipe sur Slack.
help.instructions=📂Voici comment commencer :\n• Sélectionnez un message direct ou un canal.\n• Envoyez un nouveau message avec un fichier joint ou localisez un message avec un fichier existant.\n• Cliquez sur Plus d'actions -> Connecter aux applications -> et sélectionnez ONLYOFFICE.\n• Choisissez le fichier et cliquez sur Ouvrir à côté du fichier sélectionné.\n• Modifiez le fichier selon vos besoins. Vos modifications seront enregistrées automatiquement.\n\n➕ Comment créer un fichier ?\n• Sélectionnez un message direct ou un canal.\n• Saisissez la commande /file.\n• Choisissez le format souhaité et saisissez un titre pour le fichier.\n•  Ouvrez le fichier en cliquant sur Plus d'actions -> Connecter aux applications -> et sélectionnez ONLYOFFICE.\n• Choisissez le fichier et cliquez sur Ouvrir à côté du fichier sélectionné.\n• Effectuez vos modifications dans le fichier créé. Les modifications sont enregistrées automatiquement !
