help.greeting=嗨 <@{0}>！我是 ONLYOFFICE，我能幫助您在 Slack 上提升團隊參與度與協作效率。
help.instructions=📂如何開始：\n• 選擇一則直接訊息或頻道。\n• 發送帶有附件的新訊息，或找到一則含有現有檔案的訊息。\n• 點選「更多動作」 -> 「連接到應用程式」 -> 並選擇 ONLYOFFICE。\n• 選擇檔案，然後點選檔案旁邊的「開啟」。\n• 根據需要編輯檔案，您的變更將會自動儲存。\n\n➕ 如何建立檔案？\n• 選擇一則直接訊息或頻道。\n• 輸入 /file 指令。\n• 選擇所需的格式並輸入檔案標題。\n• 點選「更多動作」 -> 「連接到應用程式」 -> 並選擇 ONLYOFFICE。\n• 選擇檔案，然後點選檔案旁邊的「開啟」。\n• 在建立的檔案中進行編輯，變更將自動儲存！
