help.greeting=Ciao <@{0}>! Sono ONLYOFFICE, qui per aiutarti a migliorare il coinvolgimento del team e la collaborazione su Slack.
help.instructions=📂 Ecco come iniziare:\n• Seleziona un messaggio diretto o un canale.\n• Invia un nuovo messaggio con un file allegato oppure individua un messaggio con un file già esistente.\n• Fai clic su Altre azioni -> Connetti app -> e seleziona ONLYOFFICE.\n• Scegli il file e fai clic su Apri accanto al file selezionato.\n• Modifica il file a seconda delle necessità. Le modifiche verranno salvate automaticamente.\n\n➕ Come creare un file?\n• Seleziona un messaggio diretto o un canale.\n• Inserisci il comando /file.\n• Scegli il formato desiderato e inserisci un titolo per il file.\n• Apri il file facendo clic su Altre azioni -> Connetti app -> e seleziona ONLYOFFICE.\n• Scegli il file e fai clic su Apri accanto al file selezionato.\n• Apporta le modifiche al file creato. Le modifiche vengono salvate automaticamente!
