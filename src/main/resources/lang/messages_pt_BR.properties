help.greeting=Olá <@{0}>! Sou a ONLYOFFICE e estou aqui para ajudar você a aumentar o engajamento e a colaboração da sua equipe no Slack.
help.instructions=📂 Veja como começar:\n• Selecione uma Mensagem Direta ou um canal.\n• Envie uma nova mensagem com um arquivo anexado ou localize uma mensagem com um arquivo existente.\n• Clique em Mais ações -> Conectar a aplicativos -> e selecione ONLYOFFICE.\n• Escolha o arquivo e clique em Abrir ao lado do arquivo selecionado.\n• Edite o arquivo conforme necessário. Suas alterações serão salvas automaticamente.\n\n➕ Como criar um arquivo?\n• Selecione uma Mensagem Direta ou um canal.\n• Digite o comando /arquivo.\n• Escolha o formato desejado e insira um título para o arquivo.\n• Abra o arquivo clicando em Mais ações -> Conectar a aplicativos -> e selecione ONLYOFFICE.\n• Escolha o arquivo e clique em Abrir ao lado do arquivo selecionado.\n• Faça suas edições no arquivo criado. As alterações são salvas automaticamente!
