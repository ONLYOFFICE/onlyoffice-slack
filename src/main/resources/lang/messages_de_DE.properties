help.greeting=Hallo <@{0}>! Ich bin ONLYOFFICE und helfe Ihnen dabei, das Team-Engagement und die Zusammenarbeit auf Slack zu verbessern.
help.instructions=📂 So starten Sie:\n• Wählen Sie eine Direktnachricht oder einen Kanal aus.\n• Senden Sie eine neue Nachricht mit angehängter Datei oder suchen Sie eine Nachricht mit einer vorhandenen Datei.\n• Klicken Sie auf „Weitere Aktionen“ -> „Mit Apps verbinden“ -> und wählen Sie ONLYOFFICE aus.\n• Wählen Sie die Datei aus und klicken Sie neben der ausgewählten Datei auf „Öffnen“.\n• Bearbeiten Sie die Datei nach Bedarf. Ihre Änderungen werden automatisch gespeichert.\n\n➕ So erstellen Sie eine Datei:\n• Wählen Sie eine Direktnachricht oder einen Kanal aus.\n• Geben Sie den Befehl /file ein.\n• Wählen Sie das gewünschte Format und geben Sie einen Titel für die Datei ein.\n• Öffnen Sie die Datei, indem Sie auf „Weitere Aktionen“ -> „Mit Apps verbinden“ -> und ONLYOFFICE klicken.\n• Wählen Sie die Datei aus und klicken Sie neben der ausgewählten Datei auf „Öffnen“.\n• Nehmen Sie Ihre Änderungen in der erstellten Datei vor. Änderungen werden automatisch gespeichert!
